name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Solana + Anchor toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          rustc --version
          solana --version || true
          anchor --version || true

      # First build creates target/deploy/escrow-keypair.json (CI-only, never committed).
      # `keys sync` then rewrites declare_id!() to match it, so the runtime ID check passes.
      - name: Build, sync program id, rebuild
        env:
          NO_DNA: "1"
        run: |
          anchor build
          anchor keys sync
          anchor build

      - name: Unit + LiteSVM tests
        run: cargo test -p escrow -- --nocapture

      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: escrow-so
          path: target/deploy/escrow.so
